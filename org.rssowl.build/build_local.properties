# WARNING: the pluginbuilder build path (build.xml + pluginbuilder.config) DOES NOT WORK.
# Three independent reasons:
#   1. pluginbuilder.config points the target platform at
#      http://www.rssowl.org/dl/target/eclipse-SDK-3.4.2_3.5.2-linux-gtk-x86_64_3.zip -> 404.
#   2. pluginbuilder.is.svn=true, so the build fetches its sources from SourceForge SVN
#      rather than using this local source tree.
#   3. pluginbuilder.features declares 7 features, this tree has only 4. Missing:
#      org.rssowl.contrib.nntp, org.rssowl.contrib.notes,
#      org.rssowl.feature.contrib.feedhandler, org.rssowl.feature.contrib.tools.
# Fixing only the paths below is NOT enough to make the build run. To compile, use
# build.ps1 in the root folder.
# The values below have been updated for this machine so they no longer point at the
# paths of the old one.

# The location of this pluginbuilder project. It provides the base directory for the build scripts.
# @category localsettings
# @type Directory
buildHome=D:/CDS/rssowl-code-r8644-trunk/org.rssowl.build

# The directory where the build takes place. This directory WILL BE DELETED before every build.
# @category localsettings
# @type Directory
buildDirectory=D:/CDS/build/pluginbuilder/org.rssowl.build

# The eclipse build host. Must be an Eclipse SDK installation with JDT and PDE. And in the case of RCP builds the RCP Delta Pack must be included, too.
# @category localsettings
# @type Directory
eclipseDir=D:/CDS/tools/eclipse/

# Environment for both the Eclipse build and test host. Determines baseos.
# @category localsettings
os=win32

# Environment for both the Eclipse build and test host. Determines basews.
# @category localsettings
ws=win32

# Environment for both the Eclipse build and test host. Determines basearch.
# @category localsettings
# Target platform da tai la win32-x86_64, khong phai x86 nhu cau hinh goc.
arch=x86_64
